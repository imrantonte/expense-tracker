name: where_did_it_go
description: "Track your expenses with ease."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Fonts for premium typography
  google_fonts: ^6.2.1

  # Chart library for expense visualizations
  fl_chart: ^0.69.0

  # Internationalization & date formatting
  intl: ^0.19.0

  # State management
  provider: ^6.1.2
  firebase_core: ^5.0.0
  firebase_auth: ^7.0.0
  cloud_firestore: ^7.0.0
  shared_preferences: ^2.5.6

  # Local push notifications for expense reminders
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4

  # Profile photo — camera & gallery picker
  image_picker: ^1.1.2

  # Google Sign-In
  google_sign_in: ^6.2.2

  # PDF generation and printing / sharing
  pdf: ^3.11.1
  printing: ^5.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/launcher_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
