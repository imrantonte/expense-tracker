name: where_did_it_go
description: "Track your expenses with ease."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Google Fonts for premium typography
  google_fonts: ^6.2.1

  # Chart library for expense visualizations
  fl_chart: ^0.69.0

  # Internationalization & date formatting
  intl: ^0.19.0

  # State management
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
